<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VII Aurora Website</title>
<style>
  :root {
    --bg: #05070d;
    --text: #eef1f8;
    --sub: #9aa3b8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }

  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: var(--bg);
  }

  .sky::before {
    content: "";
    position: absolute;
    inset: -20%;
    background-image:
      radial-gradient(1px 1px at 20% 30%, white, transparent),
      radial-gradient(1px 1px at 60% 70%, white, transparent),
      radial-gradient(1px 1px at 80% 20%, white, transparent),
      radial-gradient(1px 1px at 40% 85%, white, transparent),
      radial-gradient(1px 1px at 90% 50%, white, transparent),
      radial-gradient(1px 1px at 10% 60%, white, transparent),
      radial-gradient(1px 1px at 70% 10%, white, transparent),
      radial-gradient(1px 1px at 30% 45%, white, transparent);
    background-size: 600px 600px;
    opacity: 0.5;
  }

  .aurora {
    position: absolute;
    inset: -30%;
    filter: blur(60px);
    mix-blend-mode: screen;
  }

  .band {
    position: absolute;
    width: 140%;
    height: 55%;
    border-radius: 50%;
    opacity: 0.55;
    will-change: transform;
  }

  .band-1 {
    top: 5%;
    left: -20%;
    background: linear-gradient(90deg, transparent, #34e89e, #0f9b8e, transparent);
    animation: drift1 18s ease-in-out infinite;
  }

  .band-2 {
    top: 20%;
    left: -10%;
    background: linear-gradient(90deg, transparent, #7f5cff, #34d1e8, transparent);
    animation: drift2 22s ease-in-out infinite;
    opacity: 0.45;
  }

  .band-3 {
    top: 35%;
    left: -25%;
    background: linear-gradient(90deg, transparent, #ff5cae, #7f5cff, transparent);
    animation: drift3 26s ease-in-out infinite;
    opacity: 0.35;
  }

  @keyframes drift1 {
    0%, 100% { transform: translateX(0) translateY(0) scaleY(1) rotate(0deg); }
    50% { transform: translateX(8%) translateY(4%) scaleY(1.2) rotate(3deg); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translateX(0) translateY(0) scaleY(1) rotate(0deg); }
    50% { transform: translateX(-6%) translateY(6%) scaleY(1.15) rotate(-4deg); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translateX(0) translateY(0) scaleY(1) rotate(0deg); }
    50% { transform: translateX(5%) translateY(-5%) scaleY(1.1) rotate(2deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .band { animation: none !important; }
  }

  .content {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    gap: 2rem;
  }

  h1 {
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }

  p {
    color: var(--sub);
    font-size: 1rem;
    max-width: 32ch;
    margin: 0;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem;
    width: 100%;
    max-width: 720px;
  }

  .card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 1.5rem 1.25rem;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .card h2 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
  }

  .card p {
    max-width: none;
    font-size: 0.875rem;
    color: var(--sub);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="sky">
    <div class="aurora">
      <div class="band band-1"></div>
      <div class="band band-2"></div>
      <div class="band band-3"></div>
    </div>
  </div>
  <div class="content">
    <h1>The VII Aurora Website</h1>
    <p>Just a random website, built by @lukesicooldev in GitHub</p>
    <div class="cards">
      <div class="card">
        <h2>Officers:</h2>
        <p>idk im to lazy to add</p>
      </div>
      <div class="card">
        <h2>!!!NEWS!!!</h2>
        <p>- My birthday is in Monday ok ok very good news</p>
      </div>
      <div class="card">
        <h2>Assingmentt sceduled:</h2>
        <p>idk bro just listen to teach already</p>
      </div>
    </div>
  </div>
</body>
</html>
